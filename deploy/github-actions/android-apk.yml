name: Android APK (debug)

# Builds a Capacitor / system-WebView debug APK for sideloading and for the
# "Download APK" button on ra.devinfo.dev (+ aimlds.org mirror).
#
# ACTIVATION: copy this file to .github/workflows/android-apk.yml via the
# GitHub web editor (the connected API token cannot create workflow files).

on:
  workflow_dispatch:
  push:
    tags:
      - "apk-v*"

permissions:
  contents: write # needed to attach the APK to a GitHub Release on tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor deps
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/research-analyst-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-analyst-debug-apk
          path: dist/research-analyst-debug.apk

      - name: Publish to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/research-analyst-debug.apk
          name: Research Analyst APK ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            Debug (unsigned) Capacitor WebView APK for sideloading.
            Loads https://ra.devinfo.dev. For informational and educational use only; not financial advice.
