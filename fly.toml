# Research Analyst - Fly.io Configuration (PRIMARY)
# Deploy: fly launch --copy-config --no-deploy && fly deploy
# Docs: https://fly.io/docs/reference/configuration/

app = "research-analyst"
primary_region = "yyz"  # Toronto (closest to Calgary)

[build]
  dockerfile = "Dockerfile"

[env]
  RA_SERVER_HOST = "0.0.0.0"
  RA_SERVER_PORT = "8700"
  RA_DEBUG = "false"

[http_service]
  internal_port = 8700
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[checks]
  [checks.health]
    type = "http"
    port = 8700
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
