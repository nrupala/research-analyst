# Research Analyst — Docker Compose (local development)
#
# Usage:
#   docker compose up          # Start server
#   docker compose up --build  # Rebuild and start
#   docker compose down        # Stop

services:
  research-analyst:
    build: .
    ports:
      - "8700:8700"
    environment:
      - RA_DEBUG=true
      - RA_SERVER_HOST=0.0.0.0
      - RA_SERVER_PORT=8700
    volumes:
      - ra-cache:/app/.cache
      - ra-output:/app/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8700/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ra-cache:
  ra-output:
