# Source of record for the LIVE research-analyst-api Worker.
# Route: ra.devinfo.dev/api/*  (devinfo.dev zone). Proxies to the OCI origin
# (https://ra-origin.nrupalakolkar.com — see BACKEND_URL in src/index.js).
#
# Reconciled 2026-10-15 (release-gate finding M2): until then the live worker
# was the 2026-07-22 Cloudflare-dashboard deploy and this directory described
# it as a mirror of that deploy. The gated source in src/index.js was deployed
# through the signed wrapper (deploy/deploy-workers-signed.py) and is now
# what is live. Deploys of this worker are signed-wrapper only, with the
# owner's explicit go-ahead — see README.md.

name = "research-analyst-api"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Workers AI binding is present on the live worker; the fetch handler does
# not call it. Kept here to match the live settings exactly.
[ai]
binding = "AI"

[[routes]]
pattern = "ra.devinfo.dev/api/*"
zone_name = "devinfo.dev"
