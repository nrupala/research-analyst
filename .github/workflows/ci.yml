# Research Analyst -- CI/CD Pipeline
# Module: .github/workflows/ci.yml | Version: 0.1.0 | Updated: 2026-05-15
#
# Triggers: push to main, pull requests, version tags
# Jobs: lint, typecheck, test, Docker build, APK build (on tags)

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: mypy
        run: mypy research_analyst/ --ignore-missing-imports

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov=research_analyst --cov-report=term-missing

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t research-analyst:ci .

      - name: Smoke test
        run: |
          docker run -d --name ra-test -p 8700:8700 research-analyst:ci
          sleep 5
          curl -f http://127.0.0.1:8700/api/health || exit 1
          docker stop ra-test

  apk:
    name: APK Build (Debug)
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Add Android platform
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-analyst-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [docker, apk]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: research-analyst-debug
          path: ./artifacts

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Research Analyst v${{ steps.version.outputs.VERSION }}"
          body: |
            ## Research Analyst v${{ steps.version.outputs.VERSION }}

            See [CHANGELOG.md](https://github.com/nrupala/research-analyst/blob/main/CHANGELOG.md) for details.

            ### Assets
            - **APK (Debug)**: Android debug build for testing
            - **Docker**: `docker pull ghcr.io/nrupala/research-analyst:${{ steps.version.outputs.VERSION }}`
            - **Source**: Download and run `pip install -e .`
          files: |
            ./artifacts/app-debug.apk
          draft: false
          prerelease: false
