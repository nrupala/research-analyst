# Research Analyst - CI/CD Pipeline
# Auto-deploys to Fly.io on every push to main

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov pytest-asyncio
          pip install "fastapi>=0.115" "uvicorn[standard]>=0.30" "pydantic>=2.7" "pydantic-settings>=2.3" "httpx>=0.27" "yfinance>=0.2.40" "pandas>=2.2" "numpy>=1.26" "scipy>=1.12" "plotly>=5.22" "jinja2>=3.1" "python-dateutil>=2.9" "aiofiles>=24.1" "beautifulsoup4>=4.12" "lxml>=5.2"

      - name: Lint
        run: ruff check . || true

      - name: Type check
        run: mypy research_analyst/ --ignore-missing-imports || true

      - name: Test
        run: PYTHONPATH=. pytest tests/ -v --tb=short || true

      - name: Smoke test
        run: |
          PYTHONPATH=. python -c "
          from research_analyst.models import ResearchRequest
          from research_analyst.enums import ReportType
          from research_analyst.server import app
          print('All imports OK')
          req = ResearchRequest(ticker='AAPL')
          print(f'Request model OK: {req.ticker}')
          print('Smoke test PASSED')
          "
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: UI tests (headless, gating)
        run: node ui/tests/compare.test.mjs

      - name: UI disclaimer gate test (headless, gating)
        run: node ui/tests/disclaimer_gate.test.mjs

      - name: UI chart HTML preservation test (headless, gating)
        run: node ui/tests/chart_html_preservation.test.mjs

      - name: UI markdown link rendering test (headless, gating)
        run: node ui/tests/markdown_links.test.mjs
  deploy-fly:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Research Analyst v${{ steps.version.outputs.VERSION }}"
          body: |
            ## Research Analyst v${{ steps.version.outputs.VERSION }}
            See [CHANGELOG.md](https://github.com/nrupala/research-analyst/blob/main/CHANGELOG.md) for details.
          draft: false
          prerelease: false
