# Research Analyst - Render Blueprint (BACKUP)
# Native Python runtime, no Docker
# Docs: https://docs.render.com/blueprint-spec

services:
  - type: web
    name: research-analyst
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install "fastapi>=0.115" "uvicorn[standard]>=0.30" "pydantic>=2.7" "pydantic-settings>=2.3" "httpx>=0.27" "yfinance>=0.2.40" "pandas>=2.2" "numpy>=1.26" "scipy>=1.12" "plotly>=5.22" "jinja2>=3.1" "python-dateutil>=2.9" "aiofiles>=24.1" "beautifulsoup4>=4.12" "lxml>=5.2"
    startCommand: PYTHONPATH=. python -m uvicorn research_analyst.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RA_SERVER_HOST
        value: "0.0.0.0"
      - key: RA_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.0"
    healthCheckPath: /api/health
    autoDeploy: true
    branch: main
